[Service]
# Bound the single API process independently of the per-client rolling rate
# limit. Uvicorn returns 503 once 200 connections or tasks are active instead
# of allowing an unbounded queue to exhaust the VM.
ExecStart=
ExecStart=/opt/metis/.venv/bin/uvicorn metis_api.main:app --host 127.0.0.1 --port 8000 --limit-concurrency 200 --backlog 200
