[Service]
# Only this process loads Whisper. Other services use the loopback client.
# EnvironmentFile wins over Environment=, so override at exec time.
ExecStart=
ExecStart=/usr/bin/env METIS_SPEECH_ENGINE=faster_whisper METIS_SPEECH_CPU_THREADS=2 /opt/metis/.venv/bin/python -m metis_speech.server --port 8787
MemoryAccounting=true
MemoryHigh=1152M
MemoryMax=1536M
MemorySwapMax=1024M
OOMPolicy=kill
Restart=on-failure
RestartSec=3s
