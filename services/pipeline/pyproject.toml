[project]
name = "metis-pipeline"
version = "0.1.0"
description = "Metis ingestion pipeline: jobs, extraction, transactional outbox dispatch"
requires-python = ">=3.12"
# metis-speech: the inline transcriber.
dependencies = ["metis-contracts", "metis-state", "metis-speech"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metis_pipeline"]
