[project]
name = "metis-state"
version = "0.1.0"
description = "Metis authoritative state: SQLite adapter"
requires-python = ">=3.12"
dependencies = ["metis-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metis_state"]
